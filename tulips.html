    <script>
        // Create constellation stars
        function createConstellation() {
            const constellation = document.getElementById('constellation');
            const starCount = 150;
            constellation.style.display = 'block';
            constellation.style.position = 'fixed';
            constellation.style.top = '0';
            constellation.style.left = '0';
            constellation.style.width = '100%';
            constellation.style.height = '100%';
            constellation.style.pointerEvents = 'none';
            constellation.style.zIndex = '10';
            constellation.style.background = 'transparent';
            constellation.style.overflow = 'hidden';
            constellation.style.display = 'flex';
            constellation.style.flexWrap = 'wrap';
            constellation.style.justifyContent = 'center';
            constellation.style.alignItems = 'center';
            constellation.style.animation = 'twinkle 10s infinite';
            constellation.style.boxShadow = '0 0 20px rgba(255, 255, 255, 0.5)';
            constellation.style.filter = 'blur(1px)';
            constellation.style.zIndex = '1';
            constellation.style.backgroundImage = 'url("https://example.com/constellation-bg.png")'; // Replace with your constellation background image
            constellation.style.backgroundSize = 'cover';
            constellation.style.backgroundPosition = 'center';
            constellation.style.backgroundRepeat = 'no-repeat';
            constellation.style.position = 'fixed';
            constellation.style.top = '0';
            constellation.style.left = '0';
            constellation.style.pointerEvents = 'none';
            constellation.style.zIndex = '1000';
            constellation.style.overflow = 'hidden';
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 150 + '%';
                star.style.top = Math.random() * 150 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                constellation.appendChild(star);
            }
        }

        // Create shooting stars
        function createShootingStar() {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.top = Math.random() * 50 + '%';
            shootingStar.style.left = '-100px';
            shootingStar.style.animation = 'shootingStar 2s linear forwards';
            document.body.appendChild(shootingStar);
            
            setTimeout(() => {
                shootingStar.remove();
            }, 2000);
        }

        // Create floating particles
        function createParticles() {
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                document.body.appendChild(particle);
            }
        }

        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💗';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '0px';
            heart.style.animation = 'floatHeart 6s linear forwards';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Create butterflies
        function createButterflies() {
            const butterflyCount = 8;
            const colors = ['', 'purple', 'coral', 'rose'];
            const sizes = ['small', 'medium', 'large'];
            
            for (let i = 0; i < butterflyCount; i++) {
                const butterfly = document.createElement('div');
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
                
                butterfly.className = `butterfly ${randomColor} ${randomSize}`;
                butterfly.style.left = Math.random() * 100 + '%';
                butterfly.style.top = (Math.random() * 60 + 20) + '%';
                butterfly.style.animationDelay = Math.random() * 8 + 's';
                
                // Random flight pattern
                if (Math.random() > 0.5) {
                    butterfly.style.animation = 'butterflySwarm1 12s linear infinite';
                } else {
                    butterfly.style.animation = 'butterflySwarm2 10s linear infinite';
                }
                
                document.body.appendChild(butterfly);
            }
        }

        // Create ladybugs
        function createLadybugs() {
            const ladybugCount = 5;
            const sizes = ['small', 'medium', 'large'];
            const animations = ['ladybugCrawl', 'ladybugCrawlCircle', 'ladybugCrawlWave'];
            
            for (let i = 0; i < ladybugCount; i++) {
                const ladybug = document.createElement('div');
                const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
                const randomAnimation = animations[Math.floor(Math.random() * animations.length)];
                
                ladybug.className = `ladybug ${randomSize}`;
                ladybug.style.left = Math.random() * 80 + '%';
                ladybug.style.bottom = (Math.random() * 30 + 10) + '%';
                ladybug.style.animation = `${randomAnimation} ${8 + Math.random() * 4}s linear infinite`;
                ladybug.style.animationDelay = Math.random() * 5 + 's';
                
                document.body.appendChild(ladybug);
            }
        }

        // Initialize all effects
        function init() {
            createConstellation();
            createParticles();
            createButterflies();
            createLadybugs();
            
            // Create shooting stars periodically
            setInterval(createShootingStar, 3000 + Math.random() * 4000);
            
            // Create hearts periodically
            setInterval(createHeart, 2000 + Math.random() * 3000);
            
            // Add sparkle trail on mouse move
            document.addEventListener('mousemove', function(e) {
                if (Math.random() > 0.8) {
                    const sparkle = document.createElement('div');
                    sparkle.style.position = 'fixed';
                    sparkle.style.left = e.clientX + 'px';
                    sparkle.style.top = e.clientY + 'px';
                    sparkle.style.width = '4px';
                    sparkle.style.height = '4px';
                    sparkle.style.background = 'var(--pink-primary)';
                    sparkle.style.borderRadius = '50%';
                    sparkle.style.pointerEvents = 'none';
                    sparkle.style.zIndex = '1000';
                    sparkle.style.boxShadow = '0 0 10px var(--pink-primary)';
                    sparkle.style.animation = 'sparkleTrail 1s ease-out forwards';
                    document.body.appendChild(sparkle);
                    
                    setTimeout(() => {
                        sparkle.remove();
                    }, 1000);
                }
            });
        }

        // Start the magic when page loads
        window.addEventListener('load', init);

        // Add click interaction for more hearts
        document.addEventListener('click', function(e) {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = ['💗', '💖', '💕', '💘'][Math.floor(Math.random() * 4)];
                    heart.style.position = 'fixed';
                    heart.style.left = (e.clientX + (Math.random() - 0.5) * 100) + 'px';
                    heart.style.top = e.clientY + 'px';
                    heart.style.fontSize = (1 + Math.random()) + 'rem';
                    heart.style.color = 'var(--pink-primary)';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '1000';
                    heart.style.animation = 'floatHeart 3s ease-out forwards';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 3000);
                }, i * 200);
            }
        });
    </script>
